<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="100%" stop-color="#1a1f3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="64" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7b2ff7"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="12" y1="0" x2="52" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7b2ff7"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Border glow -->
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="url(#accent)" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Left bracket < -->
  <path d="M10 32 L20 22" stroke="#00d4ff" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M10 32 L20 42" stroke="#00d4ff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Right bracket > -->
  <path d="M54 32 L44 22" stroke="#7b2ff7" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M54 32 L44 42" stroke="#7b2ff7" stroke-width="2.5" stroke-linecap="round"/>

  <!-- JI letters -->
  <text x="32" y="38" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="18" text-anchor="middle" fill="url(#text-grad)">JI</text>

  <!-- Bottom accent line -->
  <rect x="22" y="46" width="20" height="2.5" rx="1.25" fill="url(#accent)" opacity="0.8"/>
</svg>
